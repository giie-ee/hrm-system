<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # /employees is both a web app route and a legacy backend folder. Without this,
    # Apache redirects it to a trailing-slash URL on the internal port (:10000),
    # so opening or refreshing /employees fails. Handled here (virtual-host level)
    # because the redirect fires before per-directory rewrite rules run.
    RewriteEngine On
    RewriteRule ^/employees/?$ /index.html [L]

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ /index.html [L]
    </Directory>

    <DirectoryMatch "^/var/www/html/(config|includes|lib|migrations|scripts)(/|$)">
        Require all denied
    </DirectoryMatch>

    DirectoryIndex index.html index.php
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
