<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HRMS Login API Test</title>
</head>

<body>

    <h1>HRMS Login API Test</h1>

    <form id="loginForm">

        <label>Username:</label>
        <br>

        <input
            type="text"
            id="username"
            value="admin"
            required
        >

        <br><br>

        <label>Password:</label>
        <br>

        <input
            type="password"
            id="password"
            value="Admin@123"
            required
        >

        <br><br>

        <button type="submit">
            Test Login
        </button>

    </form>

    <h2>API Response</h2>

    <pre id="response"></pre>

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                const responseBox =
                    document.getElementById("response");

                const response = await fetch(
                    "login.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                responseBox.textContent =
                    JSON.stringify(data, null, 4);

            });

    </script>

</body>

</html>
