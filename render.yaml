services:
  - type: web
    name: hrms
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: MIGRATE_ON_START
        value: "1"
      - key: SEED_DASHBOARD_USERS_ON_START
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
